<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#fff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="screen-orientation" content="landscape">
  <title>Nuotit – Note Game</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      color: #111;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: manipulation;
    }
    @media (orientation: portrait) {
      body::after {
        content: 'Rotate your device to landscape';
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        color: #111;
        font-size: 1.5rem;
        z-index: 9999;
      }
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      max-height: 100vw;
      padding: 0.5rem 1rem;
    }
    #score-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.25rem 0;
      font-size: 1.25rem;
      min-height: 2rem;
    }
    #score-bar span { font-variant-numeric: tabular-nums; }
    #staff-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 0;
    }
    #staff {
      width: 100%;
      max-width: 90vmin;
      height: auto;
      color: #000;
    }
    #piano-wrap {
      padding: 0.5rem 0;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }
    #piano {
      display: flex;
      position: relative;
      height: 22vmin;
      min-height: 80px;
      max-height: 140px;
      border-radius: 8px;
      overflow: visible;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .white-key {
      width: 10vmin;
      min-width: 36px;
      max-width: 64px;
      height: 100%;
      background: linear-gradient(180deg, #fff 0%, #f0f0f0 100%);
      border: 1px solid #999;
      border-radius: 0 0 6px 6px;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      position: relative;
      z-index: 1;
    }
    .white-key:active { background: linear-gradient(180deg, #e8e8e8 0%, #ddd 100%); }
    .white-key.correct { background: linear-gradient(180deg, #4ade80 0%, #22c55e 100%); }
    .white-key.wrong { background: linear-gradient(180deg, #f87171 0%, #ef4444 100%); }
    .black-key {
      width: 6vmin;
      min-width: 22px;
      max-width: 38px;
      height: 65%;
      background: linear-gradient(180deg, #333 0%, #111 100%);
      border: 1px solid #000;
      border-radius: 0 0 4px 4px;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      position: absolute;
      z-index: 2;
      margin-left: -3vmin;
    }
    .black-key:active { background: linear-gradient(180deg, #555 0%, #333 100%); }
    .black-key.correct { background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%); }
    .black-key.wrong { background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%); }
    .black-key[data-key="C#"] { left: 9.5vmin; }
    .black-key[data-key="D#"] { left: 19.5vmin; }
    .black-key[data-key="F#"] { left: 39.5vmin; }
    .black-key[data-key="G#"] { left: 49.5vmin; }
    .black-key[data-key="A#"] { left: 59.5vmin; }
    @media (min-width: 600px) {
      .black-key[data-key="C#"] { left: 10vmin; }
      .black-key[data-key="D#"] { left: 20vmin; }
      .black-key[data-key="F#"] { left: 40vmin; }
      .black-key[data-key="G#"] { left: 50vmin; }
      .black-key[data-key="A#"] { left: 60vmin; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="score-bar">
      <span>Score: <strong id="score">0</strong></span>
      <span id="round">Note 1</span>
    </div>
    <div id="staff-wrap">
      <svg id="staff" viewBox="0 0 400 120" preserveAspectRatio="xMidYMid meet">
        <g transform="translate(0, 20)">
          <rect width="400" height="80" fill="transparent"/>
          <!-- Staff lines -->
          <line x1="0" y1="10" x2="400" y2="10" stroke="#000" stroke-width="2"/>
          <line x1="0" y1="22" x2="400" y2="22" stroke="#000" stroke-width="2"/>
          <line x1="0" y1="34" x2="400" y2="34" stroke="#000" stroke-width="2"/>
          <line x1="0" y1="46" x2="400" y2="46" stroke="#000" stroke-width="2"/>
          <line x1="0" y1="58" x2="400" y2="58" stroke="#000" stroke-width="2"/>
          <!-- Left barline -->
          <line x1="0" y1="0" x2="0" y2="70" stroke="#000" stroke-width="3"/>
          <!-- G clef (treble) - from Capa_1 SVG; scale then translate so it stays in view -->
          <g transform="scale(0.20) translate(-42.64, -37)" fill="#000">
            <path d="M165.156,176.583c-16.007,20.073-24.81,40.457-26.128,60.599c-1.475,22.705,5.003,44.281,19.273,64.099c15.118,21.119,34.22,32.572,56.759,34.047c7.574,0.497,14.7,0.288,21.276-0.597c1.35,7.649,2.709,15.252,3.971,22.781c1.567,10.176,2.124,19.008,1.644,26.241c-0.661,9.998-3.779,18.178-9.294,24.321c-5.963,6.628-13.396,9.533-22.826,8.92c-4.105-0.269-7.722-1.326-10.904-3.201c3.745-0.862,7.145-2.469,10.119-4.785c5.761-4.469,8.989-10.965,9.521-19.28c0.503-7.999-1.529-14.995-6.067-20.778c-4.827-6.332-11.389-9.818-19.5-10.355c-8.283-0.545-15.797,2.806-21.957,9.807c-5.474,6.199-8.54,13.493-9.061,21.68c-0.797,12.227,3.847,22.67,13.85,31.026c8.771,7.321,19.272,11.421,31.22,12.202c6.792,0.445,13.354-0.337,19.466-2.328c5.021-1.635,9.842-4.12,14.366-7.37c10.94-7.878,16.88-18.182,17.692-30.656c0.63-9.506,0.148-20.767-1.454-33.603l-4.464-28.918c11.425-3.814,21.007-10.707,28.473-20.462c7.926-10.303,12.391-22.47,13.296-36.167c1.103-16.823-2.913-32.079-11.962-45.34c-9.918-14.543-23.52-22.478-40.406-23.582c-1.948-0.126-3.988-0.112-6.12,0.046l-4.744-35.516c13.168-11.257,23.832-25.409,31.723-42.092c7.798-16.574,12.383-34.514,13.608-53.305c0.718-11.046-0.797-24.754-4.508-40.761c-5.086-21.718-12.335-32.586-22.201-33.238c-3.49-0.218-7.33,1.557-12.015,5.677c-11.377,10.285-19.656,22.728-24.609,36.96c-3.833,10.87-6.368,25.403-7.548,43.208c-0.579,8.869,0.826,23.942,4.328,46.059C189.015,150.517,173.957,165.542,165.156,176.583z M263.455,274.041c0,11.63-5.743,31.162-13.754,35.931l-8.264-62.556C253.949,249.816,263.455,260.833,263.455,274.041z M222.484,104.798c0.739-11.339,3.589-23.646,8.478-36.562c6.196-16.16,12.071-21.043,15.895-22.293c1.05-0.336,2.079-0.471,3.157-0.399c5.001,0.331,9.982,2.447,9.125,15.659c-0.722,11.197-5.17,23.064-13.188,35.281c-6.452,9.851-13.95,18.074-22.31,24.501C222.471,116.385,222.072,110.961,222.484,104.798z M216.199,181.34l3.266,26.908c-9.077,3.75-16.99,9.682-23.568,17.665c-7.578,9.289-11.79,19.532-12.499,30.429c-0.735,11.305,1.797,21.664,7.514,30.741c2.974,4.837,7.063,9.137,11.76,12.643c7.7,5.727,16.575,5.294,17.985,2.177c1.429-3.106-3.845-7.991-7.993-14.515c-2.36-3.688-3.506-8.123-3.506-13.337c0-11.073,6.672-20.578,16.186-24.802l8.909,69.388c-4.745,0.982-10.055,1.295-15.824,0.922c-14.815-0.974-28.044-7.069-39.347-18.153c-11.806-11.51-17.1-24.197-16.149-38.78C164.754,235.014,182.669,207.692,216.199,181.34z"/>
          </g>
          <!-- Ledger line for C4 (when needed) -->
          <line id="ledger" x1="180" y1="70" x2="220" y2="70" stroke="#000" stroke-width="2" visibility="hidden"/>
          <!-- Quarter note: head + stem (C4–B4 only) -->
          <g id="note-group" fill="#000" stroke="none">
            <ellipse id="note-head" cx="200" cy="34" rx="10" ry="8"/>
            <line id="note-stem" x1="210" y1="34" x2="210" y2="0" stroke="#000" stroke-width="2" stroke-linecap="round"/>
          </g>
        </g>
      </svg>
    </div>
    <div id="piano-wrap">
      <div id="piano">
        <div class="black-key" data-key="C#" data-note="C#"></div>
        <div class="black-key" data-key="D#" data-note="D#"></div>
        <div class="black-key" data-key="F#" data-note="F#"></div>
        <div class="black-key" data-key="G#" data-note="G#"></div>
        <div class="black-key" data-key="A#" data-note="A#"></div>
        <div class="white-key" data-key="C" data-note="C"></div>
        <div class="white-key" data-key="D" data-note="D"></div>
        <div class="white-key" data-key="E" data-note="E"></div>
        <div class="white-key" data-key="F" data-note="F"></div>
        <div class="white-key" data-key="G" data-note="G"></div>
        <div class="white-key" data-key="A" data-note="A"></div>
        <div class="white-key" data-key="B" data-note="B"></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      'use strict';

      /* Treble staff: bottom line E4=58, space F4=52, line G4=46, space A4=40, line B4=34. Below staff: D4=64, C4=70 (ledger). */
      const STAFF_Y = { 'C': 70, 'D': 64, 'E': 58, 'F': 52, 'G': 46, 'A': 40, 'B': 34 };
      const NOTES = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
      const FREE_MS = 500;
      const WRONG_PENALTY_MS = 1000;
      const SCORE_MS_10 = 700;  /* within this: 10 points */
      const SCORE_MS_1 = 5000;   /* at or beyond: 1 point, linear between */

      let score = 0;
      let round = 0;
      let currentNote = null;
      let noteShownAt = 0;
      let wrongGuessesThisNote = 0;
      let keys = document.querySelectorAll('#piano [data-note]');
      let ledger = document.getElementById('ledger');
      let noteHead = document.getElementById('note-head');
      let noteStem = document.getElementById('note-stem');
      var audioCtx = null;

      var NOTE_FREQ = {
        'C': 261.63, 'C#': 277.18, 'D': 293.66, 'D#': 311.13, 'E': 329.63,
        'F': 349.23, 'F#': 369.99, 'G': 392.00, 'G#': 415.30, 'A': 440.00,
        'A#': 466.16, 'B': 493.88
      };

      function playPianoNote(note) {
        var freq = NOTE_FREQ[note];
        if (!freq) return;
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var now = audioCtx.currentTime;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      }

      function setNoteOnStaff(note) {
        const y = STAFF_Y[note];
        noteHead.setAttribute('cy', y);
        noteStem.setAttribute('y1', y);
        noteStem.setAttribute('y2', y > 34 ? y + 34 : y - 34);
        noteStem.setAttribute('x1', y > 34 ? 210 : 190);
        noteStem.setAttribute('x2', y > 34 ? 210 : 190);
        ledger.setAttribute('visibility', note === 'C' ? 'visible' : 'hidden');
        ledger.setAttribute('y1', 70);
        ledger.setAttribute('y2', 70);
      }

      function pickRandomNote() {
        var pool = currentNote === null
          ? NOTES.slice()
          : NOTES.filter(function (n) { return n !== currentNote; });
        currentNote = pool[Math.floor(Math.random() * pool.length)];
        noteShownAt = performance.now();
        wrongGuessesThisNote = 0;
        round += 1;
        document.getElementById('round').textContent = 'Note ' + round;
        setNoteOnStaff(currentNote);
      }

      function pointsForTime(effectiveMs) {
        if (effectiveMs <= SCORE_MS_10) return 10;
        if (effectiveMs >= SCORE_MS_1) return 1;
        return Math.round(10 - (9 * (effectiveMs - SCORE_MS_10)) / (SCORE_MS_1 - SCORE_MS_10));
      }

      function giveFeedback(keyEl, correct) {
        keyEl.classList.add(correct ? 'correct' : 'wrong');
        keyEl.setAttribute('aria-pressed', 'true');
        setTimeout(function () {
          keyEl.classList.remove('correct', 'wrong');
          keyEl.removeAttribute('aria-pressed');
        }, 280);
      }

      function onKeyPress(note) {
        if (!currentNote) return;
        playPianoNote(note);
        const keyEl = document.querySelector('#piano [data-note="' + note + '"]');
        const correct = note === currentNote;
        giveFeedback(keyEl, correct);
        if (correct) {
          var rawElapsed = performance.now() - noteShownAt;
          var effectiveMs = Math.max(0, rawElapsed - FREE_MS) + wrongGuessesThisNote * WRONG_PENALTY_MS;
          var points = pointsForTime(effectiveMs);
          score += points;
          document.getElementById('score').textContent = score;
          pickRandomNote();
        } else {
          wrongGuessesThisNote += 1;
        }
      }

      keys.forEach(function (key) {
        const note = key.getAttribute('data-note');
        key.addEventListener('click', function () { onKeyPress(note); });
        key.addEventListener('touchend', function (e) {
          e.preventDefault();
          onKeyPress(note);
        });
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }

      pickRandomNote();
    })();
  </script>
</body>
</html>
