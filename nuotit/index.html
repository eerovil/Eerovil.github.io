<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#fff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="screen-orientation" content="landscape">
  <title>Nuotit – Nuottipeli</title>
  <link rel="manifest" href="manifest.json?cache=123">
  <script type="text/javascript">
    // If cache busting param is not in the url, add it
    if (!window.location.search.includes('cache=')) {
        console.log('adding cache busting param');
        setTimeout(() => {
            console.log('redirecting to', window.location.href + '?cache=' + Date.now());
            window.location.href = window.location.href + '?cache=' + Date.now();
        }, 100);
    } else {
        console.log('cache busting param already exists');
        // remove without reloading the page
        window.history.replaceState({}, document.title, window.location.pathname);
    }
  </script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      color: #111;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: manipulation;
    }
    @media (orientation: portrait) {
      body::after {
        content: 'Käännä laite vaakasuoraan';
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        color: #111;
        font-size: 1.5rem;
        z-index: 9999;
      }
    }
    #game-screen { padding: 0.5rem 1rem; }
    #game-screen > #time-visualizer-wrap { flex-shrink: 0; }
    #game-screen > #score-bar { flex-shrink: 0; }
    #game-screen > #staff-wrap { flex: 1; min-height: 0; }
    #game-screen > #piano-wrap { flex-shrink: 0; }
    #score-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.25rem 0;
      font-size: 1.25rem;
      min-height: 2rem;
    }
    #score-bar span { font-variant-numeric: tabular-nums; }
    #time-visualizer-wrap {
      padding: 0.15rem 0;
      width: 100%;
    }
    #time-visualizer-wrap .time-label {
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 0.15rem;
    }
    #time-visualizer {
      height: 6px;
      background: #e5e5e5;
      border-radius: 3px;
      overflow: hidden;
    }
    #time-visualizer-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #dc2626 0%, #eab308 50%, #16a34a 100%);
      border-radius: 3px;
      transition: width 0.05s linear;
    }
    #menu-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 2rem;
      text-align: center;
      position: absolute;
      inset: 0;
    }
    #menu-screen h1 { font-size: 2rem; margin: 0 0 1rem; }
    #menu-screen .level-btn strong { font-weight: 700; }
    #menu-screen .btn-play {
      padding: 0.75rem 2rem;
      font-size: 1.25rem;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #menu-screen .btn-play:active { background: #333; }
    #menu-screen .level-label { margin: 0 0 0.5rem; font-size: 0.95rem; color: #666; }
    #menu-screen .level-btns { display: flex; flex-direction: column; gap: 0.75rem; align-items: center; margin-bottom: 1rem; }
    #menu-screen .level-btn {
      padding: 0.6rem 1.5rem;
      font-size: 1rem;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      min-width: 180px;
    }
    #menu-screen .level-btn:active { background: #333; }
    #menu-screen .level-btn.locked { background: #888; color: #ccc; cursor: not-allowed; }
    #menu-screen .level-btn.locked:active { background: #888; }
    #menu-screen .menu-footer { margin-top: 1.5rem; display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
    #menu-screen .btn-reset {
      padding: 0.4rem 1rem;
      font-size: 0.9rem;
      background: transparent;
      color: #666;
      border: 1px solid #999;
      border-radius: 6px;
      cursor: pointer;
    }
    #menu-screen .btn-reset:active { background: #f0f0f0; }
    #game-screen .btn-exit {
      padding: 0.35rem 0.75rem;
      font-size: 0.9rem;
      background: transparent;
      color: #666;
      border: 1px solid #999;
      border-radius: 6px;
      cursor: pointer;
    }
    #game-screen .btn-exit:active { background: #f0f0f0; }
    #game-screen { display: none; flex-direction: column; height: 100%; min-height: 0; }
    #game-screen.visible { display: flex; }
    #staff-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 0;
    }
    #staff {
      width: 100%;
      max-width: 90vmin;
      height: auto;
      color: #000;
    }
    #piano-wrap {
      padding: 0.5rem 0;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }
    #piano {
      display: flex;
      position: relative;
      width: 65vw;
      height: 40vmin;
      min-height: 80px;
      max-height: 140px;
      border-radius: 8px;
      overflow: visible;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .white-key {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: linear-gradient(180deg, #fff 0%, #f0f0f0 100%);
      border: 1px solid #999;
      border-radius: 0 0 6px 6px;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      position: relative;
      z-index: 1;
    }
    .white-key:active { background: linear-gradient(180deg, #e8e8e8 0%, #ddd 100%); }
    .white-key.correct { background: linear-gradient(180deg, #4ade80 0%, #22c55e 100%); }
    .white-key.wrong { background: linear-gradient(180deg, #f87171 0%, #ef4444 100%); }
    .black-key {
      width: 7%;
      height: 65%;
      background: linear-gradient(180deg, #333 0%, #111 100%);
      border: 1px solid #000;
      border-radius: 0 0 4px 4px;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      position: absolute;
      z-index: 2;
      top: 0;
    }
    .black-key:active { background: linear-gradient(180deg, #555 0%, #333 100%); }
    .black-key.correct { background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%); }
    .black-key.wrong { background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%); }
    .black-key[data-key="C#"] { left: calc(100% / 7 * 1 - 3.5%); }
    .black-key[data-key="D#"] { left: calc(100% / 7 * 2 - 3.5%); }
    .black-key[data-key="F#"] { left: calc(100% / 7 * 4 - 3.5%); }
    .black-key[data-key="G#"] { left: calc(100% / 7 * 5 - 3.5%); }
    .black-key[data-key="A#"] { left: calc(100% / 7 * 6 - 3.5%); }
    #staff-wrap { position: relative; }
    #correct-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.92);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s;
      z-index: 10;
    }
    #correct-overlay.visible {
      opacity: 1;
      visibility: visible;
    }
    #correct-overlay .correct-msg {
      font-size: 1.75rem;
      font-weight: bold;
      color: #16a34a;
      margin: 0 0 0.5rem;
    }
    #correct-overlay .next-msg {
      font-size: 1rem;
      color: #666;
      margin-bottom: 0.5rem;
    }
    #correct-overlay .next-progress {
      width: 70%;
      max-width: 200px;
      height: 6px;
      background: #e5e5e5;
      border-radius: 3px;
      overflow: hidden;
    }
    #correct-overlay .next-progress-bar {
      height: 100%;
      width: 0%;
      background: #16a34a;
      border-radius: 3px;
      transition: width 1.2s linear; /* must match NEXT_NOTE_DELAY_MS */
    }
    #correct-overlay .next-progress-bar.filling {
      width: 100%;
    }
    #piano.waiting { pointer-events: none; opacity: 0.7; }
  </style>
</head>

  <script>
    (function () {
      'use strict';

      /* Treble staff: bottom line E4=58, space F4=52, line G4=46, space A4=40, line B4=34. Below staff: D4=64, C4=70 (ledger). */
      const STAFF_Y = { 'C': 70, 'D': 64, 'E': 58, 'F': 52, 'G': 46, 'A': 40, 'B': 34 };
      const NOTES = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
      const FREE_MS = 500;
      const WRONG_PENALTY_MS = 1000;
      const SCORE_MS_10 = 1000;
      const SCORE_MS_1 = 10000;
      const NEXT_NOTE_DELAY_MS = 1200;
      const MAX_NOTES = 20;
      const MAX_SCORE = MAX_NOTES * 10;
      const UNLOCK_PERCENT = 0.8;
      const UNLOCK_SCORE = Math.floor(100 * UNLOCK_PERCENT);
      function topScoreKey(level) { return 'nuotitTopScore' + level; }
      const F_CLEF_UNLOCK_KEY = 'nuotitFclefUnlocked';

      /* Bass clef: C3=40, D3=34, E3=28, F3=22, G3=16, A3=10, B3=4 (ledger above) */
      const STAFF_Y_BASS = { 'C': 40, 'D': 34, 'E': 28, 'F': 22, 'G': 16, 'A': 10, 'B': 4 };

      let score = 0;
      let currentLevel = 'G';
      let round = 0;
      let currentNote = null;
      let noteShownAt = 0;
      let wrongGuessesThisNote = 0;
      let keys = document.querySelectorAll('#piano [data-note]');
      let ledger = document.getElementById('ledger');
      let ledgerTop = document.getElementById('ledger-top');
      let noteHead = document.getElementById('note-head');
      let noteStem = document.getElementById('note-stem');
      let clefG = document.getElementById('clef-g');
      let clefF = document.getElementById('clef-f');
      var audioCtx = null;

      var NOTE_FREQ = {
        'C': 261.63, 'C#': 277.18, 'D': 293.66, 'D#': 311.13, 'E': 329.63,
        'F': 349.23, 'F#': 369.99, 'G': 392.00, 'G#': 415.30, 'A': 440.00,
        'A#': 466.16, 'B': 493.88
      };

      function playPianoNote(note) {
        var freq = NOTE_FREQ[note];
        if (!freq) return;
        // On F clef, play a octave lower
        if (currentLevel === 'F') {
          freq /= 2;
        }
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var now = audioCtx.currentTime;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      }

      function setNoteOnStaff(note) {
        var staffY = currentLevel === 'G' ? STAFF_Y : STAFF_Y_BASS;
        var y = staffY[note];
        var middleY = 34;
        noteHead.setAttribute('cy', y);
        noteStem.setAttribute('y1', y);
        /* Stem up (right side) when note on or below middle; stem down (left side) when above middle */
        noteStem.setAttribute('y2', y >= middleY ? y - 34 : y + 34);
        noteStem.setAttribute('x1', y >= middleY ? 210 : 190);
        noteStem.setAttribute('x2', y >= middleY ? 210 : 190);
        if (currentLevel === 'G') {
          ledger.setAttribute('visibility', note === 'C' ? 'visible' : 'hidden');
          ledger.setAttribute('y1', 70);
          ledger.setAttribute('y2', 70);
          ledgerTop.setAttribute('visibility', 'hidden');
        } else {
          ledger.setAttribute('visibility', 'hidden');
          ledgerTop.setAttribute('visibility', 'hidden');
        }
      }

      var overlayEl = document.getElementById('correct-overlay');
      var correctMsgEl = document.getElementById('correct-msg');
      var progressBarEl = document.getElementById('next-progress-bar');
      var pianoEl = document.getElementById('piano');
      var timeVisualizerBar = document.getElementById('time-visualizer-bar');
      var timeVisualizerRafId = null;

      function cancelTimeVisualizer() {
        if (timeVisualizerRafId != null) {
          cancelAnimationFrame(timeVisualizerRafId);
          timeVisualizerRafId = null;
        }
      }

      function updateTimeVisualizer() {
        if (!currentNote || !timeVisualizerBar) return;
        var rawElapsed = performance.now() - noteShownAt;
        var effectiveMs = Math.max(0, rawElapsed - FREE_MS) + wrongGuessesThisNote * WRONG_PENALTY_MS;
        var timeLeft = Math.max(0, SCORE_MS_1 - effectiveMs);
        var pct = (timeLeft / SCORE_MS_1) * 100;
        timeVisualizerBar.style.width = pct + '%';
        if (pct > 0) {
          timeVisualizerRafId = requestAnimationFrame(updateTimeVisualizer);
        }
      }

      function hideCorrectOverlay() {
        overlayEl.classList.remove('visible');
        progressBarEl.classList.remove('filling');
        progressBarEl.style.width = '0';
        pianoEl.classList.remove('waiting');
      }

      function showCorrectOverlay(points, onComplete) {
        cancelTimeVisualizer();
        correctMsgEl.textContent = 'Oikein! +' + points;
        progressBarEl.classList.remove('filling');
        progressBarEl.style.width = '0';
        overlayEl.classList.add('visible');
        pianoEl.classList.add('waiting');
        progressBarEl.offsetHeight;
        progressBarEl.classList.add('filling');
        setTimeout(function () {
          hideCorrectOverlay();
          if (onComplete) onComplete();
        }, NEXT_NOTE_DELAY_MS);
      }

      function pickRandomNote() {
        cancelTimeVisualizer();
        hideCorrectOverlay();
        var pool = currentNote === null
          ? NOTES.slice()
          : NOTES.filter(function (n) { return n !== currentNote; });
        currentNote = pool[Math.floor(Math.random() * pool.length)];
        noteShownAt = performance.now();
        wrongGuessesThisNote = 0;
        round += 1;
        document.getElementById('round').textContent = 'Nuotti ' + round + ' / ' + MAX_NOTES;
        setNoteOnStaff(currentNote);
        timeVisualizerBar.style.width = '100%';
        timeVisualizerRafId = requestAnimationFrame(updateTimeVisualizer);
      }

      function isFclefUnlocked() {
        var gTop = parseInt(localStorage.getItem(topScoreKey('G')) || '0', 10);
        console.log('gTop', gTop);
        console.log('UNLOCK_SCORE', UNLOCK_SCORE);
        return gTop >= UNLOCK_SCORE || localStorage.getItem(F_CLEF_UNLOCK_KEY) === 'true';
      }

      function showMenu() {
        cancelTimeVisualizer();
        document.getElementById('menu-screen').style.display = 'flex';
        document.getElementById('game-screen').classList.remove('visible');
        console.log('showMenu', topScoreKey('G'));
        var topG = parseInt(localStorage.getItem(topScoreKey('G')) || '0', 10);
        var topF = parseInt(localStorage.getItem(topScoreKey('F')) || '0', 10);
        document.getElementById('top-score-g').textContent = topG;
        document.getElementById('top-score-f').textContent = topF;
        console.log('topG', localStorage.getItem(topScoreKey('G')));
        var unlocked = isFclefUnlocked();
        var btnF = document.getElementById('btn-level-f');
        var labelF = document.getElementById('btn-f-label');
        if (unlocked) {
          btnF.classList.remove('locked');
          labelF.textContent = 'F-avain (bassoviivasto)';
          btnF.disabled = false;
        } else {
          btnF.classList.add('locked');
          labelF.textContent = 'F-avain — saavuta 80 % avataksesi';
          btnF.disabled = true;
        }
      }

      function startGame(level) {
        currentLevel = level || 'G';
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('game-screen').classList.add('visible');
        clefG.style.display = currentLevel === 'G' ? 'block' : 'none';
        clefF.style.display = currentLevel === 'F' ? 'block' : 'none';
        document.getElementById('level-label').textContent = currentLevel === 'G' ? 'G-avain' : 'F-avain';
        score = 0;
        round = 0;
        currentNote = null;
        document.getElementById('score').textContent = '0';
        pickRandomNote();
      }

      function endGame() {
        var key = topScoreKey(currentLevel);
        var top = Math.max(parseInt(localStorage.getItem(key) || '0', 10), score);
        localStorage.setItem(key, String(top));
        showMenu();
      }

      function pointsForTimeBase(effectiveMs) {
        if (effectiveMs <= SCORE_MS_10) return 10;
        if (effectiveMs >= SCORE_MS_1) return 0;
        return Math.round(10 - (9 * (effectiveMs - SCORE_MS_10)) / (SCORE_MS_1 - SCORE_MS_10));
      }

      function pointsForTime(effectiveMs) {
        // Convert points to percentage of MAX_SCORE
        return Math.round(pointsForTimeBase(effectiveMs) / MAX_SCORE * 100);
      }

      function giveFeedback(keyEl, correct) {
        keyEl.classList.add(correct ? 'correct' : 'wrong');
        keyEl.setAttribute('aria-pressed', 'true');
        setTimeout(function () {
          keyEl.classList.remove('correct', 'wrong');
          keyEl.removeAttribute('aria-pressed');
        }, 280);
      }

      function onKeyPress(note) {
        if (!currentNote) return;
        playPianoNote(note);
        const keyEl = document.querySelector('#piano [data-note="' + note + '"]');
        const correct = note === currentNote;
        giveFeedback(keyEl, correct);
        if (correct) {
          var rawElapsed = performance.now() - noteShownAt;
          var effectiveMs = Math.max(0, rawElapsed - FREE_MS) + wrongGuessesThisNote * WRONG_PENALTY_MS;
          var points = pointsForTime(effectiveMs);
          score += points;
          document.getElementById('score').textContent = score;
          if (round >= MAX_NOTES) {
            showCorrectOverlay(points, endGame);
          } else {
            showCorrectOverlay(points, pickRandomNote);
          }
        } else {
          wrongGuessesThisNote += 1;
        }
      }

      keys.forEach(function (key) {
        const note = key.getAttribute('data-note');
        key.addEventListener('click', function () { onKeyPress(note); });
        key.addEventListener('touchend', function (e) {
          e.preventDefault();
          onKeyPress(note);
        });
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }

      function resetScores() {
        if (prompt('Kirjoita "nollaa" jos haluat nollata ennätykset.') != 'nollaa') {
          return;
        }
        localStorage.removeItem(topScoreKey('G'));
        localStorage.removeItem(topScoreKey('F'));
        localStorage.removeItem(F_CLEF_UNLOCK_KEY);
        showMenu();
      }

      document.getElementById('btn-level-g').addEventListener('click', function () { startGame('G'); });
      document.getElementById('btn-level-f').addEventListener('click', function () {
        if (isFclefUnlocked()) startGame('F');
      });
      document.getElementById('btn-reset-scores').addEventListener('click', resetScores);
      document.getElementById('btn-refresh').addEventListener('click', function () { location.reload(); });
      document.getElementById('btn-exit').addEventListener('click', showMenu);
      showMenu();
    })();
  </script>
</body>
</html>
