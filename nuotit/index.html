<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#fff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="screen-orientation" content="landscape">
    <title>Nuotit – Nuottipeli</title>
    <link rel="manifest" href="manifest.json?cache=123">
    <script type="text/javascript">
        // If cache busting param is not in the url, add it
        if (!window.location.search.includes('cache=')) {
            console.log('adding cache busting param');
            setTimeout(() => {
                console.log('redirecting to', window.location.href + '?cache=' + Date.now());
                window.location.href = window.location.href + '?cache=' + Date.now();
            }, 100);
        } else {
            console.log('cache busting param already exists');
            // remove without reloading the page
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #fff;
            color: #111;
            font-family: system-ui, -apple-system, sans-serif;
            touch-action: manipulation;
        }

        @media (orientation: portrait) {
            body::after {
                content: 'Käännä laite vaakasuoraan';
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #fff;
                color: #111;
                font-size: 1.5rem;
                z-index: 9999;
            }
        }

        #game-screen {
            padding: 0.5rem 1rem;
        }

        #game-screen>#progress-wrap {
            flex-shrink: 0;
        }

        #game-screen>#score-bar {
            flex-shrink: 0;
        }

        #game-screen>#staff-wrap {
            flex: 1;
            min-height: 0;
        }

        #game-screen>#piano-wrap {
            flex-shrink: 0;
        }

        #score-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.25rem 0;
            font-size: 1.25rem;
            min-height: 2rem;
        }

        #score-bar span {
            font-variant-numeric: tabular-nums;
        }

        #progress-wrap {
            padding: 0.15rem 0;
            width: 100%;
        }

        #progress-wrap .progress-label {
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 0.15rem;
        }

        #level-progress-bar {
            height: 8px;
            background: #e5e5e5;
            border-radius: 4px;
            overflow: hidden;
        }

        #level-progress-fill {
            height: 100%;
            width: 0%;
            background: #16a34a;
            border-radius: 4px;
            transition: width 0.2s ease;
        }

        #wrong-overlay,
        #level-complete-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.96);
            z-index: 20;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s;
        }

        #wrong-overlay.visible,
        #level-complete-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        #wrong-overlay h2 {
            color: #dc2626;
            margin: 0 0 0.5rem;
            font-size: 1.5rem;
        }

        #level-complete-overlay h2 {
            color: #16a34a;
            margin: 0 0 0.5rem;
            font-size: 1.5rem;
        }

        #wrong-overlay .correct-note-msg {
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        #wrong-overlay .btn-menu,
        #level-complete-overlay .btn-menu {
            padding: 0.5rem 1.5rem;
            font-size: 1rem;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #menu-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100%;
            padding: 2rem;
            text-align: center;
            position: absolute;
            inset: 0;
        }

        #menu-screen h1 {
            font-size: 2rem;
            margin: 0 0 1rem;
            flex-shrink: 0;
        }

        #menu-screen .level-btn strong {
            font-weight: 700;
        }

        #menu-screen .btn-play {
            padding: 0.75rem 2rem;
            font-size: 1.25rem;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #menu-screen .btn-play:active {
            background: #333;
        }

        #menu-screen .level-label {
            margin: 0 0 0.5rem;
            font-size: 0.95rem;
            color: #666;
            flex-shrink: 0;
        }

        #menu-screen .level-btns {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1rem;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0 0.5rem;
            width: 100%;
            max-width: 100%;
        }

        #menu-screen .level-btn {
            position: relative;
            overflow: hidden;
            padding: 0.6rem 0.75rem;
            font-size: 0.95rem;
            background: #444;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            min-width: 0;
            min-height: 3rem;
        }
        #menu-screen .level-btn .level-btn-fill {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0;
            background: #111;
            border-radius: 8px 0 0 8px;
            pointer-events: none;
        }
        #menu-screen .level-btn .level-btn-text {
            position: relative;
            z-index: 1;
        }

        #menu-screen .level-btn:active {
            background: #555;
        }

        #menu-screen .level-btn.locked {
            background: #666;
            color: #ccc;
            cursor: not-allowed;
        }

        #menu-screen .level-btn.locked:active {
            background: #666;
        }

        #menu-screen .menu-footer {
            margin-top: 1.5rem;
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        #menu-screen .btn-reset {
            padding: 0.4rem 1rem;
            font-size: 0.9rem;
            background: transparent;
            color: #666;
            border: 1px solid #999;
            border-radius: 6px;
            cursor: pointer;
        }

        #menu-screen .btn-reset:active {
            background: #f0f0f0;
        }

        #game-screen .btn-exit {
            padding: 0.35rem 0.75rem;
            font-size: 0.9rem;
            background: transparent;
            color: #666;
            border: 1px solid #999;
            border-radius: 6px;
            cursor: pointer;
        }

        #game-screen .btn-exit:active {
            background: #f0f0f0;
        }

        #game-screen {
            display: none;
            flex-direction: column;
            height: 100%;
            min-height: 0;
        }

        #game-screen.visible {
            display: flex;
        }

        #staff-wrap {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 0;
        }

        #staff {
            width: 100%;
            max-width: 90vmin;
            height: auto;
            color: #000;
        }

        #piano-wrap {
            padding: 0.5rem 0;
            display: flex;
            justify-content: flex-start;
            align-items: flex-end;
            width: 100%;
            overflow: visible;
        }

        #piano {
            width: 100vw;
            height: 40vmin;
            min-height: 80px;
            max-height: 140px;
            border-radius: 0;
            overflow-x: hidden;
            overflow-y: hidden;
            box-shadow: none;
            margin-left: 0;
            touch-action: pan-y;
        }

        .piano-inner {
            display: flex;
            height: 100%;
            min-width: 0;
        }

        .octave {
            display: flex;
            position: relative;
            width: 65vw;
            flex-shrink: 0;
            height: 100%;
        }

        .white-key {
            flex: 1;
            min-width: 0;
            height: 100%;
            background: linear-gradient(180deg, #fff 0%, #f0f0f0 100%);
            border: 1px solid #999;
            border-radius: 0 0 6px 6px;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
            position: relative;
            z-index: 1;
        }

        .white-key:active {
            background: linear-gradient(180deg, #e8e8e8 0%, #ddd 100%);
        }

        .white-key .key-hold-fill,
        .black-key .key-hold-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 0;
            border-radius: inherit;
            pointer-events: none;
            transition: height 0.2s ease-out;
        }
        .white-key .key-hold-fill {
            background: rgba(0, 0, 0, 0.25);
        }
        .black-key .key-hold-fill {
            background: rgba(255, 255, 255, 0.25);
        }
        .white-key.holding .key-hold-fill,
        .black-key.holding .key-hold-fill {
            height: 100%;
            transition: height 0.3s linear;
        }

        .white-key.correct {
            background: linear-gradient(180deg, #4ade80 0%, #22c55e 100%);
        }

        .white-key.wrong {
            background: linear-gradient(180deg, #f87171 0%, #ef4444 100%);
        }

        .black-key {
            width: 7%;
            height: 65%;
            background: linear-gradient(180deg, #333 0%, #111 100%);
            border: 1px solid #000;
            border-radius: 0 0 4px 4px;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
            position: absolute;
            z-index: 2;
            top: 0;
        }

        .black-key:active {
            background: linear-gradient(180deg, #555 0%, #333 100%);
        }

        .black-key.correct {
            background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
        }

        .black-key.wrong {
            background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
        }

        .octave .black-key[data-key="C#"] {
            left: calc(100% / 7 * 1 - 3.5%);
        }

        .octave .black-key[data-key="D#"] {
            left: calc(100% / 7 * 2 - 3.5%);
        }

        .octave .black-key[data-key="F#"] {
            left: calc(100% / 7 * 4 - 3.5%);
        }

        .octave .black-key[data-key="G#"] {
            left: calc(100% / 7 * 5 - 3.5%);
        }

        .octave .black-key[data-key="A#"] {
            left: calc(100% / 7 * 6 - 3.5%);
        }

        #staff-wrap {
            position: relative;
        }

        #correct-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.92);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s;
            z-index: 10;
        }

        #correct-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        #correct-overlay .correct-msg {
            font-size: 1.75rem;
            font-weight: bold;
            color: #16a34a;
            margin: 0 0 0.5rem;
        }

        #correct-overlay .next-msg {
            font-size: 1rem;
            color: #666;
            margin-bottom: 0.5rem;
        }

        #correct-overlay .next-progress {
            width: 70%;
            max-width: 200px;
            height: 6px;
            background: #e5e5e5;
            border-radius: 3px;
            overflow: hidden;
        }

        #correct-overlay .next-progress-bar {
            height: 100%;
            width: 0%;
            background: #16a34a;
            border-radius: 3px;
            transition: width 1.2s linear;
            /* must match NEXT_NOTE_DELAY_MS */
        }

        #correct-overlay .next-progress-bar.filling {
            width: 100%;
        }

        #piano.waiting {
            pointer-events: none;
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <div id="menu-screen">
        <h1>Nuotit</h1>
        <p class="level-label">Valitse taso</p>
        <div class="level-btns" id="menu-level-btns">
        </div>
        <div class="menu-footer">
            <button type="button" class="btn-reset" id="btn-reset-scores">Nollaa pisteet</button>
            <button type="button" class="btn-reset" id="btn-refresh">Päivitä</button>
        </div>
    </div>
    <div id="game-screen">
        <div id="progress-wrap">
            <div class="progress-label">Edistyminen</div>
            <div id="level-progress-bar">
                <div id="level-progress-fill"></div>
            </div>
        </div>
        <div id="score-bar">
            <span id="progress-text">0 / 20</span>
            <span id="level-label">Taso 1</span>
            <button type="button" class="btn-exit" id="btn-exit">Sulje</button>
        </div>
        <div id="staff-wrap">
            <div id="wrong-overlay">
                <h2 id="wrong-overlay-title">Väärin</h2>
                <p class="correct-note-msg" id="wrong-overlay-msg">Oikea nuotti oli: C</p>
            </div>
            <div id="level-complete-overlay">
                <h2>Taso läpäisty!</h2>
                <button type="button" class="btn-menu" id="level-complete-btn-menu">Valikko</button>
            </div>
            <div id="correct-overlay">
                <p class="correct-msg" id="correct-msg">Oikein! +5</p>
                <p class="next-msg">Seuraava nuotti...</p>
                <div class="next-progress">
                    <div class="next-progress-bar" id="next-progress-bar"></div>
                </div>
            </div>

                    <line x1="0" y1="58" x2="400" y2="58" stroke="#000" stroke-width="2" />

                    <g id="note-group" fill="#000" stroke="none">

        </div>
        <div id="piano-wrap">
            <div id="piano">

                osc.start(now);
                osc.stop(now + 0.4);

            function playJingle(notes) {

                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                for (var j = 0; j < ledgerTopEls.length; j++) {
                    if (j < numTop) {
                        var ty = STAFF_TOP_Y - STAFF_LINE_SPACING * (j + 1);
                        ledgerTopEls[j].setAttribute('y1', ty);
                        ledgerTopEls[j].setAttribute('y2', ty);
                        ledgerTopEls[j].setAttribute('visibility', 'visible');
                    } else {
                        ledgerTopEls[j].setAttribute('visibility', 'hidden');
                    }
                }
            }

            function setClefForLevel(level) {
                var useBass = (NOTES_BY_LEVEL[level - 1] || {}).clef === 'bass';
                document.getElementById('clef-g').style.display = useBass ? 'none' : '';
                document.getElementById('clef-f').style.display = useBass ? '' : 'none';
            }

            var overlayEl = document.getElementById('correct-overlay');
            var correctMsgEl = document.getElementById('correct-msg');
            var progressBarEl = document.getElementById('next-progress-bar');
            var pianoEl = document.getElementById('piano');
            var levelProgressFill = document.getElementById('level-progress-fill');
            var progressTextEl = document.getElementById('progress-text');

            function updateProgressDisplay() {
                var pct = (progress / MAX_NOTES) * 100;
                if (levelProgressFill) levelProgressFill.style.width = pct + '%';
                if (progressTextEl) progressTextEl.textContent = progress + ' / ' + MAX_NOTES;
            }

            function hideCorrectOverlay() {
                overlayEl.classList.remove('visible');
                progressBarEl.classList.remove('filling');
                progressBarEl.style.width = '0';
                pianoEl.classList.remove('waiting');
            }

            function showCorrectOverlay(onComplete) {
                correctMsgEl.textContent = 'Oikein!';
                progressBarEl.classList.remove('filling');
                progressBarEl.style.width = '0';
                overlayEl.classList.add('visible');
                pianoEl.classList.add('waiting');
                progressBarEl.offsetHeight;
                progressBarEl.classList.add('filling');
                setTimeout(function () {
                    hideCorrectOverlay();
                    if (onComplete) onComplete();
                }, NEXT_NOTE_DELAY_MS);
            }

            function clearCorrectKeyHighlight() {
                keys.forEach(function (k) { k.classList.remove('correct'); });
            }

            var wrongOverlayTimeoutId = null;
            function showWrongOverlay(correctNote) {
                delete notesShownThisRound[correctNote];
                clearCorrectKeyHighlight();
                var keyNote = toPianoKeyNote(correctNote);
                var correctKeyEl = document.querySelector('#piano [data-note="' + keyNote + '"]');
                if (correctKeyEl) correctKeyEl.classList.add('correct');
                pendingRetryNote = correctNote;
                retryAtStep = Math.random() < 0.5 ? 2 : 3;
                stepsSinceFailure = 0;
                progress = Math.max(0, progress - 3);
                updateProgressDisplay();
                document.getElementById('wrong-overlay-msg').textContent = 'Oikea nuotti oli: ' + scientificToHelmholtz(correctNote);
                document.getElementById('wrong-overlay').classList.add('visible');
                lastFailedNote = correctNote;
                playFailureJingle();
                if (wrongOverlayTimeoutId != null) clearTimeout(wrongOverlayTimeoutId);
                wrongOverlayTimeoutId = setTimeout(function () {
                    wrongOverlayTimeoutId = null;
                    document.getElementById('wrong-overlay').classList.remove('visible');
                    clearCorrectKeyHighlight();
                    pickRandomNote();
                }, WRONG_OVERLAY_DELAY_MS);
            }

            function levelComplete() {
                localStorage.setItem(levelPassedKey(currentLevel), 'true');
                setLevelBest(currentLevel, MAX_NOTES);
                lastFailedNote = null;
                document.getElementById('level-complete-overlay').classList.add('visible');
                playWinJingle();
            }

            function pickRandomNote() {
                hideCorrectOverlay();
                clearCorrectKeyHighlight();
                document.getElementById('wrong-overlay').classList.remove('visible');
                document.getElementById('level-complete-overlay').classList.remove('visible');
                if (wrongOverlayTimeoutId != null) {
                    clearTimeout(wrongOverlayTimeoutId);
                    wrongOverlayTimeoutId = null;
                }
                var notes = (NOTES_BY_LEVEL[currentLevel - 1] || {}).notes || [];
                var forceNote = null;
                if (pendingRetryNote !== null && stepsSinceFailure === 1 && retryAtStep === 2) {
                    forceNote = pendingRetryNote;
                    pendingRetryNote = null;
                    stepsSinceFailure = 2;
                } else if (pendingRetryNote !== null && stepsSinceFailure === 2 && retryAtStep === 3) {
                    forceNote = pendingRetryNote;
                    pendingRetryNote = null;
                    stepsSinceFailure = 3;
                }
                if (forceNote !== null) {
                    currentNote = forceNote;
                } else {
                    var unseen = notes.filter(function (n) { return !notesShownThisRound[n]; });
                    var pool = unseen.length > 0
                        ? (currentNote === null ? unseen : unseen.filter(function (n) { return n !== currentNote; }))
                        : notes.filter(function (n) { return n !== currentNote; });
                    if (pool.length === 0) pool = (unseen.length ? unseen : notes.slice()).filter(function (n) { return n !== currentNote; });
                    if (pool.length === 0) pool = unseen.length ? unseen : notes.slice();
                    if (pendingRetryNote !== null && stepsSinceFailure === 0) {
                        pool = pool.filter(function (n) { return n !== pendingRetryNote; });
                        if (pool.length === 0) pool = notes.filter(function (n) { return n !== pendingRetryNote; });
                    }
                    if (pendingRetryNote !== null && stepsSinceFailure === 1 && retryAtStep === 3) {
                        pool = pool.filter(function (n) { return n !== pendingRetryNote; });
                        if (pool.length === 0) pool = notes.filter(function (n) { return n !== pendingRetryNote; });
                    }
                    if (currentNote === null && lastFailedNote && notes.indexOf(lastFailedNote) !== -1 && pool.indexOf(lastFailedNote) !== -1) {
                        currentNote = lastFailedNote;
                        lastFailedNote = null;
                    } else if (currentNote === null && !lastFailedNote && currentLevel > 1) {
                        var prevNotes = (NOTES_BY_LEVEL[currentLevel - 2] || {}).notes || [];
                        var newInLevel = pool.filter(function (n) { return prevNotes.indexOf(n) === -1; });
                        if (newInLevel.length > 0) pool = newInLevel;
                        currentNote = pool[Math.floor(Math.random() * pool.length)];
                    } else {
                        currentNote = pool[Math.floor(Math.random() * pool.length)];
                    }
                    if (pendingRetryNote !== null) stepsSinceFailure = stepsSinceFailure + 1;
                }
                notesShownThisRound[currentNote] = true;
                noteShownAt = performance.now();
                document.getElementById('level-label').textContent = 'Taso ' + currentLevel;
                setNoteOnStaff(currentNote);
                updateProgressDisplay();
            }

            function isLevelUnlocked(levelNum) {
                if (levelNum === 1) return true;
                return localStorage.getItem(levelPassedKey(levelNum - 1)) === 'true';
            }

            function scientificToHelmholtz(noteFull) {
                var parsed = parseNoteFull(noteFull);
                if (!parsed) return noteFull;
                var letter = parsed.letter;
                if (letter === 'B') letter = 'H';
                else if (letter === 'Bb') letter = 'H\u266D';
                else letter = letter.replace('#', '\u266F').replace('b', '\u266D');
                if (parsed.octave === 2) {
                    return letter.toUpperCase();
                }
                if (parsed.octave === 3) {
                    return letter.toLowerCase();
                } else if (parsed.octave > 3) {
                    const smallNumber = parsed.octave - 3;
                    const smallNumberMap = {
                        1: '¹',
                        2: '²',
                        3: '³',
                        4: '⁴',
                        5: '⁵',
                        6: '⁶',
                        7: '⁷',
                        8: '⁸',
                        9: '⁹',
                    };
                    return letter.toLowerCase() + smallNumberMap[smallNumber];
                } else if (parsed.octave < 2) {
                    const smallNumber = 2 - parsed.octave;
                    const smallNumberMap = {
                        1: '₁',
                        2: '₂',
                        3: '₃',
                        4: '₄',
                        5: '₅',
                    };
                    return letter.toUpperCase() + smallNumberMap[smallNumber];
                }
                return noteFull;
            }

            function showMenu() {
                if (wrongOverlayTimeoutId != null) {
                    clearTimeout(wrongOverlayTimeoutId);
                    wrongOverlayTimeoutId = null;
                }
                clearCorrectKeyHighlight();
                setClefForLevel(1);
                document.getElementById('menu-screen').style.display = 'flex';
                document.getElementById('game-screen').classList.remove('visible');
                document.getElementById('wrong-overlay').classList.remove('visible');
                document.getElementById('level-complete-overlay').classList.remove('visible');
                function getLevelLabel(i) {
                    var li = NOTES_BY_LEVEL[i - 1].notes;
                    const scientificFirst = scientificToHelmholtz(li[0]);
                    const scientificLast = scientificToHelmholtz(li[li.length - 1]);
                    return ": " + scientificFirst + '–' + scientificLast;
                }
                var latestUnlocked = 0;
                for (var L = NUM_LEVELS; L >= 1; L--) {
                    if (isLevelUnlocked(L)) { latestUnlocked = L; break; }
                }
                for (var i = 1; i <= NUM_LEVELS; i++) {
                    var btn = document.getElementById('btn-level-' + i);
                    var textEl = btn.querySelector('.level-btn-text');
                    var fillEl = btn.querySelector('.level-btn-fill');
                    var passed = localStorage.getItem(levelPassedKey(i)) === 'true';
                    var unlocked = isLevelUnlocked(i);
                    if (unlocked) {
                        btn.classList.remove('locked');
                        btn.disabled = false;
                        textEl.textContent = 'Taso ' + i + getLevelLabel(i) + (passed ? ' ✓' : '');
                    } else {
                        btn.classList.add('locked');
                        btn.disabled = true;
                        textEl.textContent = 'Taso ' + i + ' — läpäise taso ' + (i - 1);
                    }
                    if (i === latestUnlocked && fillEl) {
                        var best = getLevelBest(i);
                        fillEl.style.width = (best / MAX_NOTES * 100) + '%';
                    } else if (fillEl && !unlocked) {
                        fillEl.style.width = '0%';
                    } else if (fillEl && unlocked) {
                        fillEl.style.width = '100%';
                    }
                }
            }

            var OCTAVE_VW = 65;
            var TARGET_KEY_VW = 20;
            var LETTER_INDEX = { 'C': 0, 'D': 1, 'E': 2, 'F': 3, 'G': 4, 'A': 5, 'B': 6 };
            function getScrollLeftForNote(noteFull) {
                var parsed = parseNoteFull(noteFull);
                if (!parsed) return 0;
                var letterForScroll = parsed.letter.replace(/#|b/g, '');
                var keyIndex = LETTER_INDEX[letterForScroll];
                if (keyIndex === undefined) return 0;
                if (parsed.letter.indexOf('#') !== -1 || parsed.letter.indexOf('b') !== -1) keyIndex += 0.5;
                var octaveIndex = parsed.octave - 1;
                var noteLeftVw = octaveIndex * OCTAVE_VW + (keyIndex / 7) * OCTAVE_VW;
                return Math.max(0, (noteLeftVw - TARGET_KEY_VW) / 100 * window.innerWidth);
            }

            function startGame(levelNum) {
                currentLevel = parseInt(levelNum, 10);
                document.getElementById('menu-screen').style.display = 'none';
                document.getElementById('game-screen').classList.add('visible');
                setClefForLevel(currentLevel);
                progress = 0;
                currentNote = null;
                notesShownThisRound = {};
                pendingRetryNote = null;
                stepsSinceFailure = 0;
                var pianoEl = document.getElementById('piano');
                if (pianoEl) {
                    var notes = (NOTES_BY_LEVEL[currentLevel - 1] || {}).notes || [];
                    var lowestNote = notes && notes[0];
                    pianoEl.scrollLeft = lowestNote ? getScrollLeftForNote(lowestNote) : 0;
                }
                pickRandomNote();
            }

            function giveFeedback(keyEl, correct) {
                keyEl.classList.add(correct ? 'correct' : 'wrong');
                keyEl.setAttribute('aria-pressed', 'true');
                setTimeout(function () {
                    keyEl.classList.remove('correct', 'wrong');
                    keyEl.removeAttribute('aria-pressed');
                }, 280);
            }

            function onKeyPress(noteFull) {
                if (!currentNote) return;
                if (document.getElementById('wrong-overlay').classList.contains('visible') ||
                    document.getElementById('level-complete-overlay').classList.contains('visible')) return;
                playPianoNote(noteFull);
                var keyEl = document.querySelector('#piano [data-note="' + noteFull + '"]');
                var correct = (noteFull === currentNote) || (toPianoKeyNote(currentNote) === noteFull);
                if (keyEl) giveFeedback(keyEl, correct);
                if (correct) {
                    progress += 1;
                    updateProgressDisplay();
                    if (progress > getLevelBest(currentLevel)) setLevelBest(currentLevel, progress);
                    if (progress >= MAX_NOTES) {
                        showCorrectOverlay(levelComplete);
                    } else {
                        showCorrectOverlay(pickRandomNote);
                    }
                } else {
                    showWrongOverlay(currentNote);
                }
            }

            var holdTimeoutId = null;
            var holdKeyEl = null;
            function cancelHold() {
                if (holdTimeoutId != null) {
                    clearTimeout(holdTimeoutId);
                    holdTimeoutId = null;
                }
                if (holdKeyEl) {
                    holdKeyEl.classList.remove('holding');
                    holdKeyEl = null;
                }
            }
            function startKeyHold(note, keyEl) {
                cancelHold();
                holdKeyEl = keyEl;
                keyEl.classList.add('holding');
                holdTimeoutId = setTimeout(function () {
                    holdTimeoutId = null;
                    holdKeyEl.classList.remove('holding');
                    holdKeyEl = null;
                    onKeyPress(note);
                }, HOLD_MS);
            }

            keys.forEach(function (key) {
                const note = key.getAttribute('data-note');
                var fill = document.createElement('span');
                fill.className = 'key-hold-fill';
                fill.setAttribute('aria-hidden', 'true');
                key.appendChild(fill);
                key.addEventListener('mousedown', function (e) {
                    e.preventDefault();
                    startKeyHold(note, key);
                });
                key.addEventListener('touchstart', function (e) {
                    e.preventDefault();
                    startKeyHold(note, key);
                }, { passive: false });
            });
            document.addEventListener('mouseup', cancelHold);
            document.addEventListener('touchend', function (e) {
                var hadHold = holdTimeoutId != null;
                cancelHold();
                if (hadHold) e.preventDefault();
            }, { passive: false });

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(function () { });
            }

            function resetScores() {
                if (prompt('Kirjoita "nollaa" jos haluat nollata tasojen läpäisyt.') !== 'nollaa') {
                    return;
                }
                for (var i = 1; i <= NUM_LEVELS; i++) {
                    localStorage.removeItem(levelPassedKey(i));
                    localStorage.removeItem(levelBestKey(i));
                }
                showMenu();
            }

            document.getElementById('level-complete-btn-menu').addEventListener('click', showMenu);
            for (var i = 1; i <= NUM_LEVELS; i++) {
                (function (levelNum) {
                    document.getElementById('btn-level-' + levelNum).addEventListener('click', function () {
                        if (isLevelUnlocked(levelNum)) startGame(levelNum);
                    });
                })(i);
            }
            document.getElementById('btn-reset-scores').addEventListener('click', resetScores);
            document.getElementById('btn-refresh').addEventListener('click', function () { location.reload(); });
            document.getElementById('btn-exit').addEventListener('click', showMenu);
            showMenu();
        })();
    </script>
</body>

</html>
