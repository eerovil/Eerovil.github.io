<head>
<meta name="viewport" content="width=device-width, user-scalable=no" />
<link rel="manifest" href="manifest.json">
<style>
body {
    background: black;
    margin: 0;
}
#photos_list > div {
    display: inline-block;
    width: 10vw;
    height: 10vw;
}

@media screen and (max-width: 480px)
{
    #photos_list > div {
        width: 25vw;
        height: 25vw;
    }
}
#photos_list img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
#photo_big {
    position: fixed;
    z-index: 9999;
    top: 0;
	right:0;
	bottom:0;
	left:0;
    width: 100%;
    background-color: black;
}
#photo_big img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}
#photo_overlay {
    z-index: 999999;
    position: fixed;
    top: 0;
	right:0;
	bottom:0;
	left:0;
}
.hidden {
    display: none;
}
</style>
</head>

<body>
<button id="btnAdd" style="display: none;">Btnadd</button>
<button id="sign-in-or-out-button"
        style="margin-left: 25px">Sign In/Authorize</button>
<button id="revoke-access-button"
        style="display: none; margin-left: 25px">Revoke access</button>
<button id="pick-photos-button" type="button"
        style="display: none; margin-left: 25px">Choose photos…</button>

<div id="auth-status" style="display: inline; padding-left: 25px"></div>

<script defer src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
<script defer src="https://apis.google.com/js/api.js"></script>
<script defer src="https://accounts.google.com/gsi/client"></script>
<script defer src="index.js?ver=41"></script>
<div id="photos_list"></div>
<div id="photo_overlay" class="hidden" onClick=setPhoto(null)></div>
<div id="photo_big" class="hidden"></div>
</body>
